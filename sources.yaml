  steps:
    - run: "npm create vite@8.1.1 -- . --template vanilla-ts"
  gitignore: Node
  normalize:
    - type: strip_paths
      paths: ["node_modules", "package-lock.json", "dist", ".gitignore", "src/assets/hero.png"]
    - type: line_endings
    - type: trailing_newline
    - type: sort_files
  resolved:
    ref: "create-vite 8.1.1"
    captured: "2026-07-11"

sveltekit:
  kind: scaffolder
  steps:
    - run: "npx --yes sv@0.16.2 create . --template minimal --types ts --no-add-ons --no-install"
  gitignore: Node
  normalize:
    - type: strip_paths
      paths: ["node_modules", "package-lock.json", ".svelte-kit", ".gitignore", ".vscode", "README.md"]
    - type: line_endings
    - type: trailing_newline
    - type: sort_files
  resolved:
    ref: "sv 0.16.2"
    captured: "2026-07-11"

angular:
  kind: scaffolder
  steps:
    - run: "npx --yes @angular/cli@21.2.19 new {{.RepoSlug}} --directory . --style css --ssr false --skip-git --skip-install --defaults"
  gitignore: Node
  normalize:
    - type: strip_paths
      paths: ["node_modules", "package-lock.json", ".angular", "dist", ".gitignore", ".vscode", "README.md", "public/favicon.ico"]
    - type: line_endings
    - type: trailing_newline
    - type: sort_files
  resolved:
    ref: "@angular/cli 21.2.19"
    captured: "2026-07-11"
